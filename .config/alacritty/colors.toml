# wallust.toml needs to include this
# alacritty = { template = 'alacritty.toml', target = '~/.config/alacritty/colors.toml' }
# and alacritty.toml should import that file under [general]
[colors.primary]
background = "#0F1010"
foreground = "#A4A4A4"

[colors.normal]
black   = "#3C3D3D"
red     = "#A8A8A8"
green   = "#BABABA"
yellow  = "#5C5C5C"
blue    = "#6F6F6F"
magenta = "#D0D0D0"
cyan    = "#686969"
white   = "#8A8A8A"

[colors.bright]
black   = "#5D5E5E"
red     = "#A8A8A8"
green   = "#BABABA"
yellow  = "#5C5C5C"
blue    = "#6F6F6F"
magenta = "#D0D0D0"
cyan    = "#686969"
white   = "#BCBCBC"
